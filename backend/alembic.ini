[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration file names
# revision ids in this project are assigned by hand (condo_zzz_local_stub,
# condo_001_initial, ...) to keep the condo_ prefix visible in the filename,
# so the default file_template (rev id + slug) is left as-is.
file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone for timestamps embedded in migration filenames
timezone = UTC

# sqlalchemy.url is intentionally left blank here — env.py pulls the real
# value from app.config.settings (which reads DATABASE_URL / .env), so this
# file never has to hold a credential.
sqlalchemy.url =

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
